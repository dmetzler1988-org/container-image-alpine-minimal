name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily: Alpine package fixes reach the apk repository without a new alpine image digest.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: Raise the release level to at least this one.
        type: choice
        options: [none, patch, minor, major]
        default: none
      dry-run:
        description: Only report version, tags and versions.lock; publish nothing.
        type: boolean
        default: false

permissions: {}

env:
  IMAGE: ghcr.io/dmetzler1988-org/alpine-minimal

jobs:
  resolve:
    name: Resolve base image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ env.IMAGE }}
      # Tag and digest separately: GitHub drops a job output shaped like "name:tag=x://name:tag@sha256:…"
      # because it looks like a URL with credentials. The build context is assembled in each `with:` instead.
      tag: ${{ steps.base.outputs.tag }}
      digest: ${{ steps.base.outputs.digest }}
      build-args: ${{ steps.base.outputs.build-args }}
      images: ${{ steps.base.outputs.images }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read tag from Dockerfile and resolve digest and version
        id: base
        run: |
          tag=$(sed -n 's/^FROM alpine:\([0-9][0-9.]*\)[[:space:]]*$/\1/p' Dockerfile | head -n 1)
          if [ -z "$tag" ]; then
            echo "::error::Dockerfile has no 'FROM alpine:<version>' line"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "alpine:$tag" --format '{{json .Manifest}}' | jq -r '.digest')
          version=$(docker run --rm "alpine:$tag@$digest" cat /etc/alpine-release)
          build_args=$(printf 'ALPINE_IMAGE=docker.io/library/alpine:%s\nALPINE_DIGEST=%s' "$version" "$digest")
          images=$(jq -n -c --arg args "$build_args" '[{
            key: "alpine", target: "", "build-args": $args, "tag-suffix": "",
            "major-tag": true, latest: true, "version-command": "cat /etc/alpine-release"
          }]')
          base=$(jq -n -c --arg image "docker.io/library/alpine:$tag" --arg digest "$digest" --arg alpine "$version" \
            '{image: $image, digest: $digest, alpineVersion: $alpine}')
          # printf, not echo: the JSON contains "\n" escapes that some shells' echo would expand.
          {
            printf 'tag=%s\n' "$tag"
            printf 'digest=%s\n' "$digest"
            printf 'build-args<<EOF\n%s\nEOF\n' "$build_args"
            printf 'images=%s\n' "$images"
            printf 'base=%s\n' "$base"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: resolve
    permissions:
      contents: read
      security-events: write
    uses: dmetzler1988-org/container-workflows/.github/workflows/build-image.yaml@cbaee78284f04cac4e8e3a2fff8ab235d38ca970 # v2.0.0
    with:
      image-key: alpine
      build-contexts: alpine:${{ needs.resolve.outputs.tag }}=docker-image://alpine:${{ needs.resolve.outputs.tag }}@${{ needs.resolve.outputs.digest }}
      build-args: ${{ needs.resolve.outputs.build-args }}

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [resolve, build]
    # Here, not on the workflow: runs that build nothing must never cancel a waiting release.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: dmetzler1988-org/container-workflows/.github/workflows/release.yaml@cbaee78284f04cac4e8e3a2fff8ab235d38ca970 # v2.0.0
    with:
      image: ${{ needs.resolve.outputs.image }}
      images: ${{ needs.resolve.outputs.images }}
      base: ${{ needs.resolve.outputs.base }}
      build-contexts: alpine:${{ needs.resolve.outputs.tag }}=docker-image://alpine:${{ needs.resolve.outputs.tag }}@${{ needs.resolve.outputs.digest }}
      level: ${{ inputs.level || 'none' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

  automerge:
    name: Dependabot auto-merge
    if: github.event_name == 'pull_request'
    needs: build
    permissions:
      contents: write
      pull-requests: write
    uses: dmetzler1988-org/container-workflows/.github/workflows/dependabot-automerge.yaml@cbaee78284f04cac4e8e3a2fff8ab235d38ca970 # v2.0.0
